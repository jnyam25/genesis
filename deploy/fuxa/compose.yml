# FUXA SCADA for the Captsone line (docs/prototype/scada.md §5).
#   cd deploy/fuxa
#   docker compose up -d        → http://localhost:1881
#
# Pinned to a tested release: don't move to :latest before the demo.
# Project, history, logs and images persist in the folders next to this file
# (gitignored). To keep the project in git, export it with FUXA's
# "Save Project As" to captsone-fuxa.json in this folder.

services:
  fuxa:
    image: frangoteam/fuxa:1.3.4
    restart: unless-stopped
    ports:
      # Laptop only. To show SCADA screens on other devices, change to
      # '1881:1881' and turn on FUXA login first (scada.md §5.4).
      - '127.0.0.1:1881:1881'
    extra_hosts:
      # Lets FUXA reach the virtual PLC on the host: host.docker.internal:5020
      # (built into Docker Desktop; this line adds it on Linux / Raspberry Pi).
      - 'host.docker.internal:host-gateway'
    volumes:
      - './appdata:/usr/src/app/FUXA/server/_appdata'
      - './db:/usr/src/app/FUXA/server/_db'
      - './logs:/usr/src/app/FUXA/server/_logs'
      - './images:/usr/src/app/FUXA/server/_images'
    # environment:
    #   - TZ=America/New_York   # local time in FUXA's logs and reports
