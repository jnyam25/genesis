; ESP32 #2 station node — robotic arm (Hiwonder xArm, LX bus servos) + sort height sensor.
; Runs on the ESP32 that drives the xArm's servo bus: the xArm ESP32 controller
; itself, or an ESP32 DevKit wired to the bus. Set the bus pins over the console.
; Build/flash: pio run -t upload ; console: pio device monitor
[env:station-node]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    emelianov/modbus-esp8266@4.1.0
    pololu/VL53L1X@1.3.1
build_flags = -Wall
